name: Deploy Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - "cloudflare/**"
      - ".github/workflows/cloudflare-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
      CLOUDFLARE_D1_DATABASE_NAME: ${{ vars.CLOUDFLARE_D1_DATABASE_NAME }}
      CLOUDFLARE_R2_BUCKET_NAME: ${{ vars.CLOUDFLARE_R2_BUCKET_NAME }}
      CLOUDFLARE_VECTORIZE_INDEX: ${{ vars.CLOUDFLARE_VECTORIZE_INDEX }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate Cloudflare resource variables
        run: |
          test -n "$CLOUDFLARE_D1_DATABASE_ID" || (echo "Missing CLOUDFLARE_D1_DATABASE_ID" && exit 1)
          test -n "$CLOUDFLARE_D1_DATABASE_NAME" || (echo "Missing CLOUDFLARE_D1_DATABASE_NAME" && exit 1)
          test -n "$CLOUDFLARE_R2_BUCKET_NAME" || (echo "Missing CLOUDFLARE_R2_BUCKET_NAME" && exit 1)
          test -n "$CLOUDFLARE_VECTORIZE_INDEX" || (echo "Missing CLOUDFLARE_VECTORIZE_INDEX" && exit 1)

      - name: Inject Cloudflare resource configuration
        run: |
          sed -i "s|__D1_DATABASE_ID__|$CLOUDFLARE_D1_DATABASE_ID|g" wrangler.jsonc
          sed -i "s|__D1_DATABASE_NAME__|$CLOUDFLARE_D1_DATABASE_NAME|g" wrangler.jsonc
          sed -i "s|__R2_BUCKET_NAME__|$CLOUDFLARE_R2_BUCKET_NAME|g" wrangler.jsonc
          sed -i "s|__VECTORIZE_INDEX__|$CLOUDFLARE_VECTORIZE_INDEX|g" wrangler.jsonc

      - name: Ensure Vectorize index exists
        run: |
          if npx wrangler vectorize get "$CLOUDFLARE_VECTORIZE_INDEX" >/dev/null 2>&1; then
            echo "Vectorize index '$CLOUDFLARE_VECTORIZE_INDEX' already exists."
          else
            echo "Creating Vectorize index '$CLOUDFLARE_VECTORIZE_INDEX'."
            npx wrangler vectorize create "$CLOUDFLARE_VECTORIZE_INDEX" --dimensions=768 --metric=cosine
          fi

      - name: Deploy to Cloudflare
        run: npm run deploy
