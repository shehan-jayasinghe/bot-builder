services:
  backend:
    build:
      context: ./backend
    container_name: bot-builder-api
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - mongo
    networks:
      - bot-builder-network

  mongo:
    image: mongo:7
    container_name: bot-builder-mongo
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - bot-builder-mongo-data:/data/db
    networks:
      - bot-builder-network

  # TODO: add Redis for session cache
  # TODO: add Qdrant for RAG

networks:
  bot-builder-network:
    driver: bridge

volumes:
  bot-builder-mongo-data:
