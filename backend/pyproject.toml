[tool.poetry]
name = "bot-builder"
version = "0.1.0"
description = "ShoutOUT Bot Builder Backend"
authors = ["ShoutOUT AI Team"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
fastapi = "^0.115.0"
python-multipart = "^0.0.20"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
pydantic-settings = "^2.6.0"
motor = "^3.7.0"
redis = "^5.2.0"
celery = {version = "^5.4.0", extras = ["redis"]}
boto3 = "^1.35.0"
langchain = "^1.3.2"
langchain-core = "^1.4.0"
langchain-aws = "^1.4.0"
langgraph = ">=1.2.4,<1.3.0"
httpx = "^0.28.0"
email-validator = "^2.2.0"
pyjwt = { extras = ["crypto"], version = "^2.10.0" }
langchain-community = "^0.3.0"
langchain-text-splitters = "^0.3.0"
qdrant-client = "^1.12.0"
neo4j = "^5.26.0"
pypdf = "^5.0.0"
python-docx = "^1.1.0"
beautifulsoup4 = "^4.12.0"
nemoguardrails = "^0.23.0"
ragas = "^0.4.3"
llama-index-core = "^0.14.23"
llama-index-vector-stores-qdrant = "^0.10.2"
llama-index-graph-stores-neo4j = "^0.7.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
flower = "^2.0.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
