[tool.poetry]
name = "bot-builder"
version = "0.1.0"
description = "ShoutOUT Bot Builder Backend"
authors = ["ShoutOUT AI Team"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
pydantic-settings = "^2.6.0"
motor = "^3.7.0"
boto3 = "^1.35.0"
langchain-aws = "^0.2.0"
langchain-core = "^0.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
httpx = "^0.28.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
