services:
  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: bot-builder-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - bot-builder-infra

  neo4j:
    image: neo4j:5.26
    container_name: bot-builder-neo4j
    restart: unless-stopped
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-changeme}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    networks:
      - bot-builder-infra

networks:
  bot-builder-infra:
    driver: bridge

volumes:
  qdrant_data:
  neo4j_data:
